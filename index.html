<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnyStream" />
    <meta
      name="description"
      content="AnyStream — watch thousands of free live TV channels from around the world. YouTube-style IPTV browser, fully client-side."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://iptv-org.github.io" crossorigin />
    <link rel="dns-prefetch" href="https://iptv-org.github.io" />
    <title>AnyStream — Live TV from everywhere</title>
    <script>
      // Apply the persisted theme/sidebar preference before first paint to
      // avoid a flash of the wrong layout on hard reloads.
      (function () {
        try {
          var collapsed = window.localStorage.getItem('anystream_sidebar') === 'collapsed';
          document.documentElement.dataset.sidebar = collapsed ? 'collapsed' : 'expanded';
        } catch (error) {
          document.documentElement.dataset.sidebar = 'expanded';
        }
        document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-yt-bg text-yt-text antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; font-family: system-ui, sans-serif; text-align: center; color: #f1f1f1">
        <h1 style="font-size: 20px">AnyStream needs JavaScript</h1>
        <p style="color: #aaaaaa">
          The channel catalogue is assembled in your browser directly from the public iptv-org API.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
